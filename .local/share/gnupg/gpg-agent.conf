pinentry-program /home/skill/.local/bin/pinentry-skill
enable-ssh-support

# Allow gpg-preset-passphrase to push the passphrase into the agent so that
# non-interactive sessions can sign and auth without a pinentry prompt.
allow-preset-passphrase

# 10800s = 3h
default-cache-ttl 10800
max-cache-ttl 10800
default-cache-ttl-ssh 10800
max-cache-ttl-ssh 10800
