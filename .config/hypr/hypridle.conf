general {
    lock_cmd = qs -c skill ipc call lock activate
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300 # 5min: dim
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 600 # 10min: lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900 # 15min: screen off
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1500 # 25min: suspend
    # Guarded on AC so a long build or download is never interrupted.
    on-timeout = bash -c '[[ $(< /sys/class/power_supply/ACAD/online) == 0 ]] && systemctl suspend'
}
